name: Verify fixed browser and loaded streak sticker

on:
  workflow_dispatch:
    inputs:
      password_login:
        description: "Validate password login without injecting existing cookies (never sends)"
        type: boolean
        default: true
      interactive_sms:
        description: "Allow one SMS handoff over key-restricted temporary SSH (never sends chats)"
        type: boolean
        default: false
      ssh_public_key:
        description: "Ed25519 public key authorized for this run; never enter a private key or SMS code"
        type: string
        default: ""

concurrency:
  group: douyin-spark-flow
  cancel-in-progress: false

permissions:
  contents: read

env:
  CLOAK_CHROMIUM_VERSION: 146.0.7680.177.5
  CLOAK_BINARY_SHA256: 4a12bcde95fa1bb1beef2b41ab5e5c27c36be78e3be3d0dac8c64d705216670e
  CLOAKBROWSER_AUTO_UPDATE: "false"
  PYTHONUNBUFFERED: "1"

jobs:
  verify:
    timeout-minutes: 25
    runs-on: ubuntu-latest
    environment: user-data
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test Douyin accessibility
        run: curl -I https://creator.douyin.com/

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chromium system dependencies
        run: python -m playwright install-deps chromium

      - name: Download pinned CloakBrowser
        run: |
          set -euo pipefail
          tag="chromium-v${CLOAK_CHROMIUM_VERSION}"
          url="https://github.com/CloakHQ/CloakBrowser/releases/download/${tag}/cloakbrowser-linux-x64.tar.gz"
          curl -fL --connect-timeout 15 --max-time 600 --retry 2 --retry-delay 2 \
            -o /tmp/cb.tar.gz "$url"
          echo "${CLOAK_BINARY_SHA256}  /tmp/cb.tar.gz" | sha256sum -c -

          mkdir -p /tmp/cb_extract "$HOME/cloakbrowser"
          tar -xzf /tmp/cb.tar.gz -C /tmp/cb_extract
          rm -f /tmp/cb.tar.gz
          chrome="$(find /tmp/cb_extract -maxdepth 6 -type f -name chrome -perm -u+x | head -n 1)"
          test -n "${chrome}" || { echo "CloakBrowser release has no chrome binary" >&2; exit 1; }
          cp -a "$(dirname "${chrome}")/." "$HOME/cloakbrowser/"
          chmod +x "$HOME/cloakbrowser/chrome"
          test -f "$HOME/cloakbrowser/icudtl.dat"
          "$HOME/cloakbrowser/chrome" --version
          echo "CLOAKBROWSER_BINARY_PATH=$HOME/cloakbrowser/chrome" >> "$GITHUB_ENV"

      - name: Load scheduled task configuration
        run: |
          printf 'TASKS=%s\n' "$(jq -ce . config/github-actions.tasks.json)" >> "$GITHUB_ENV"
          printf 'DOUYIN_STREAK_STICKER=%s\n' '续火花' >> "$GITHUB_ENV"
          printf 'INTER_RECIPIENT_DELAY_MIN_SECONDS=%s\n' '3' >> "$GITHUB_ENV"
          printf 'INTER_RECIPIENT_DELAY_MAX_SECONDS=%s\n' '8' >> "$GITHUB_ENV"

      - name: Check fixed browser identity across processes
        id: identity
        continue-on-error: true
        env:
          PROXY_ADDRESS: ${{ secrets.PROXY_ADDRESS }}
        run: python -m tools.verify_browser_identity

      - name: Start restricted temporary SSH code receiver
        if: ${{ inputs.interactive_sms }}
        env:
          SSH_PUBLIC_KEY: ${{ inputs.ssh_public_key }}
        run: |
          set -euo pipefail
          test "${{ inputs.password_login }}" = true
          umask 077
          otp_dir="$RUNNER_TEMP/douyin-otp"
          mkdir -p "$otp_dir" artifacts/ssh-handoff
          printf '%s\n' "$SSH_PUBLIC_KEY" > "$otp_dir/authorized_keys"
          python -c 'import os,re; assert re.fullmatch(r"ssh-ed25519 [A-Za-z0-9+/]+={0,3}(?: [^\r\n]*)?", os.environ["SSH_PUBLIC_KEY"])'
          ssh-keygen -lf "$otp_dir/authorized_keys" >/dev/null
          url="https://github.com/owenthereal/upterm/releases/download/v0.35.0/upterm_linux_amd64.tar.gz"
          curl -fL --connect-timeout 15 --max-time 120 --retry 2 -o "$otp_dir/upterm.tar.gz" "$url"
          echo "ed0920d2b35684fa288be49a250ce62cfd32e68597946c2ef4f4a2999c4ec080  $otp_dir/upterm.tar.gz" | sha256sum -c -
          tar -xzf "$otp_dir/upterm.tar.gz" -C "$otp_dir" upterm
          chmod u+x "$otp_dir/upterm"
          ssh-keygen -q -t ed25519 -N "" -f "$otp_dir/host_key"
          printf 'DOUYIN_OTP_DIR=%s\n' "$otp_dir" >> "$GITHUB_ENV"
          timeout 60 "$otp_dir/upterm" host --detach --accept --name douyin-otp \
            --private-key "$otp_dir/host_key" --authorized-keys "$otp_dir/authorized_keys" \
            --known-hosts "$otp_dir/known_hosts" --skip-host-key-check \
            --no-sftp --join-timeout 15m \
            --force-command "/usr/bin/env DOUYIN_OTP_DIR=$otp_dir $(command -v python) $GITHUB_WORKSPACE/tools/otp_receiver.py" \
            --output json -- /bin/sleep 1500 > "$otp_dir/session.json"
          jq -er '.sshCommand' "$otp_dir/session.json" > artifacts/ssh-handoff/ssh.txt
          cp "$otp_dir/known_hosts" artifacts/ssh-handoff/known_hosts
          test -s artifacts/ssh-handoff/ssh.txt

      - uses: actions/upload-artifact@v4
        if: ${{ inputs.interactive_sms }}
        with:
          name: restricted-ssh-handoff
          path: artifacts/ssh-handoff/
          retention-days: 1

      - name: Start no-send probe and wait for SMS request
        id: start_probe
        env:
          COOKIES_601501187I3: ${{ secrets.COOKIES_601501187I3 }}
          PROXY_ADDRESS: ${{ secrets.PROXY_ADDRESS }}
          DOUYIN_PHONE: ${{ secrets.DOUYIN_PHONE }}
          DOUYIN_PASSWORD: ${{ secrets.DOUYIN_PASSWORD }}
          DOUYIN_DIAGNOSTIC_KEY: ${{ secrets.DOUYIN_DIAGNOSTIC_KEY }}
          PASSWORD_LOGIN: ${{ inputs.password_login }}
        run: |
          set -euo pipefail
          (
            set +e
            if [ "$PASSWORD_LOGIN" = true ]; then
              python main.py login-probe
            else
              python main.py probe
            fi
            printf '%s\n' "$?" > "$RUNNER_TEMP/douyin-probe-exit"
          ) > "$RUNNER_TEMP/douyin-probe.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/douyin-probe-pid"
          for attempt in $(seq 1 750); do
            if [ -f "$RUNNER_TEMP/douyin-probe-exit" ]; then break; fi
            if [ -n "${DOUYIN_OTP_DIR:-}" ] && [ -f "$DOUYIN_OTP_DIR/ready" ]; then break; fi
            sleep 1
          done
          test -f "$RUNNER_TEMP/douyin-probe-exit" || test -f "${DOUYIN_OTP_DIR:-/nonexistent}/ready"

      - uses: actions/upload-artifact@v4
        if: ${{ inputs.interactive_sms && !cancelled() }}
        with:
          name: sms-waiting-page
          path: artifacts/otp-waiting/
          if-no-files-found: ignore
          retention-days: 1

      - name: Wait for SMS submission or device verification
        if: ${{ inputs.interactive_sms && !cancelled() }}
        run: |
          for attempt in $(seq 1 660); do
            if [ -f "$RUNNER_TEMP/douyin-probe-exit" ] || [ -f artifacts/device-waiting/login.json ]; then break; fi
            sleep 1
          done

      - uses: actions/upload-artifact@v4
        if: ${{ inputs.interactive_sms && !cancelled() }}
        with:
          name: device-verification-page
          path: artifacts/device-waiting/
          if-no-files-found: ignore
          retention-days: 1

      - name: Wait for no-send probe result
        id: probe
        continue-on-error: true
        run: |
          for attempt in $(seq 1 660); do
            if [ -f "$RUNNER_TEMP/douyin-probe-exit" ]; then
              cat "$RUNNER_TEMP/douyin-probe.log"
              exit "$(cat "$RUNNER_TEMP/douyin-probe-exit")"
            fi
            sleep 1
          done
          kill "$(cat "$RUNNER_TEMP/douyin-probe-pid")" || true
          echo 'No-send probe exceeded its deadline'
          exit 1

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: no-send-verification
          path: |
            logs/
            artifacts/sticker-probe/
            artifacts/password-login/
            artifacts/browser-identity.json

      - name: Require both checks to pass
        if: ${{ steps.identity.outcome != 'success' || steps.probe.outcome != 'success' }}
        run: exit 1

      - name: Close temporary SSH and erase handoff files
        if: ${{ always() && inputs.interactive_sms }}
        run: |
          otp_dir="$RUNNER_TEMP/douyin-otp"
          if [ -x "$otp_dir/upterm" ]; then
            "$otp_dir/upterm" session stop douyin-otp || true
          fi
          rm -rf "$otp_dir"
