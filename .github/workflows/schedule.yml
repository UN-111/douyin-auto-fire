name: DouYin Spark Flow Schedule Run

# Manual runs default to configuration validation.  Scheduled runs remain
# dormant until the repository variable below is explicitly set.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Validate configuration, run tasks, or prove sticker UI"
        required: true
        type: choice
        options:
          - validate
          - probe
          - send
        default: validate
  schedule:
    - cron: "0 18 * * *" # 18:00 UTC / 02:00 Asia/Shanghai

concurrency:
  group: douyin-spark-flow
  cancel-in-progress: false

permissions: {}

env:
  # Keep this pair in lockstep with the verified CloakHQ release artifact.
  CLOAK_CHROMIUM_VERSION: 146.0.7680.177.5
  CLOAK_BINARY_SHA256: 4a12bcde95fa1bb1beef2b41ab5e5c27c36be78e3be3d0dac8c64d705216670e
  CLOAKBROWSER_AUTO_UPDATE: "false"
  PYTHONUNBUFFERED: "1"

jobs:
  # This job never installs a browser or imports the task runner.  It only
  # checks that TASKS and each dynamic cookie secret are valid JSON.
  validate-config:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    environment: user-data
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Export GitHub environment values
        env:
          VARS_JSON: ${{ toJson(vars) }}
          SECRETS_JSON: ${{ toJson(secrets) }}
        run: python utils/export_github_env.py

      - name: Load scheduled task configuration
        run: |
          printf 'TASKS=%s\n' "$(jq -ce . config/github-actions.tasks.json)" >> "$GITHUB_ENV"
          printf 'DOUYIN_STREAK_STICKER=%s\n' '续火花' >> "$GITHUB_ENV"
          printf 'INTER_RECIPIENT_DELAY_MIN_SECONDS=%s\n' '3' >> "$GITHUB_ENV"
          printf 'INTER_RECIPIENT_DELAY_MAX_SECONDS=%s\n' '8' >> "$GITHUB_ENV"

      - name: Validate tasks and cookies without sending
        run: |
          python - <<'PY'
          import json
          import os

          raw_tasks = os.environ.get("TASKS", "").strip()
          if not raw_tasks:
              raise SystemExit("TASKS is missing")
          try:
              tasks = json.loads(raw_tasks)
          except json.JSONDecodeError as exc:
              raise SystemExit(f"TASKS is not valid JSON: {exc}") from exc
          if not isinstance(tasks, list) or not tasks:
              raise SystemExit("TASKS must be a non-empty JSON array")

          for index, task in enumerate(tasks, start=1):
              if not isinstance(task, dict):
                  raise SystemExit(f"TASKS[{index}] must be an object")
              unique_id = str(task.get("unique_id", "")).strip()
              if not unique_id:
                  raise SystemExit(f"TASKS[{index}] is missing unique_id")
              if not str(task.get("fingerprint", "")).strip():
                  raise SystemExit(f"TASKS[{index}] is missing fingerprint")
              targets = task.get("targets")
              if not isinstance(targets, list) or not targets:
                  raise SystemExit(f"TASKS[{index}] must have a non-empty targets list")

              cookie_key = f"COOKIES_{unique_id}".upper()
              raw_cookies = os.environ.get(cookie_key, "").strip()
              if not raw_cookies:
                  raise SystemExit(f"{cookie_key} is missing")
              try:
                  cookies = json.loads(raw_cookies)
              except json.JSONDecodeError as exc:
                  raise SystemExit(f"{cookie_key} is not valid JSON: {exc}") from exc
              if not isinstance(cookies, list):
                  raise SystemExit(f"{cookie_key} must be a JSON array")
              print(f"validated task {index}: {unique_id} ({len(targets)} targets)")

          print("PROXY_ADDRESS configured" if os.environ.get("PROXY_ADDRESS") else "PROXY_ADDRESS omitted (direct connection)")
          print("Configuration validation complete; no browser or message task was started.")
          PY

  send:
    # The absent/default ENABLE variable prevents scheduled sends and manual
    # send mode.  The no-send probe is intentionally available without it.
    if: >-
      ${{
        (github.event_name == 'schedule' && vars.ENABLE_DOUYIN_SPARK_FLOW == 'true') ||
        (github.event_name == 'workflow_dispatch' && inputs.mode == 'send' && vars.ENABLE_DOUYIN_SPARK_FLOW == 'true') ||
        (github.event_name == 'workflow_dispatch' && inputs.mode == 'probe')
      }}
    timeout-minutes: 40
    runs-on: ubuntu-latest
    environment: user-data
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test Douyin accessibility
        run: curl -I https://creator.douyin.com/

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chromium system dependencies
        run: python -m playwright install-deps chromium

      - name: Download pinned CloakBrowser
        run: |
          set -euo pipefail
          tag="chromium-v${CLOAK_CHROMIUM_VERSION}"
          url="https://github.com/CloakHQ/CloakBrowser/releases/download/${tag}/cloakbrowser-linux-x64.tar.gz"
          curl -fL --connect-timeout 15 --max-time 600 --retry 2 --retry-delay 2 \
            -o /tmp/cb.tar.gz "$url"
          echo "${CLOAK_BINARY_SHA256}  /tmp/cb.tar.gz" | sha256sum -c -

          mkdir -p /tmp/cb_extract "$HOME/cloakbrowser"
          tar -xzf /tmp/cb.tar.gz -C /tmp/cb_extract
          rm -f /tmp/cb.tar.gz
          chrome="$(find /tmp/cb_extract -maxdepth 6 -type f -name chrome -perm -u+x | head -n 1)"
          test -n "${chrome}" || { echo "CloakBrowser release has no chrome binary" >&2; exit 1; }
          cp -a "$(dirname "${chrome}")/." "$HOME/cloakbrowser/"
          chmod +x "$HOME/cloakbrowser/chrome"
          test -f "$HOME/cloakbrowser/icudtl.dat"
          "$HOME/cloakbrowser/chrome" --version
          echo "CLOAKBROWSER_BINARY_PATH=$HOME/cloakbrowser/chrome" >> "$GITHUB_ENV"

      - name: Export GitHub environment values
        env:
          VARS_JSON: ${{ toJson(vars) }}
          SECRETS_JSON: ${{ toJson(secrets) }}
        run: python utils/export_github_env.py

      - name: Load scheduled task configuration
        run: |
          printf 'TASKS=%s\n' "$(jq -ce . config/github-actions.tasks.json)" >> "$GITHUB_ENV"
          printf 'DOUYIN_STREAK_STICKER=%s\n' '续火花' >> "$GITHUB_ENV"
          printf 'INTER_RECIPIENT_DELAY_MIN_SECONDS=%s\n' '3' >> "$GITHUB_ENV"
          printf 'INTER_RECIPIENT_DELAY_MAX_SECONDS=%s\n' '8' >> "$GITHUB_ENV"

      - name: Run DouYin Spark Flow
        run: |
          if [ "${{ inputs.mode }}" = "probe" ]; then
            python main.py probe
          else
            python main.py task
          fi

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: run-logs
          path: |
            logs/
            artifacts/sticker-probe/

  email-on-failure:
    if: ${{ always() && needs.send.result == 'failure' }}
    needs: send
    runs-on: ubuntu-latest
    environment: user-data
    timeout-minutes: 5
    env:
      QQ_SMTP_USERNAME: ${{ secrets.QQ_SMTP_USERNAME }}
      QQ_SMTP_AUTH_CODE: ${{ secrets.QQ_SMTP_AUTH_CODE }}
      ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
      ALERT_EMAIL_CC: ${{ secrets.ALERT_EMAIL_CC }}
    steps:
      - name: Send failure email through QQ Mail
        shell: python3 {0}
        run: |
          import os
          import smtplib
          import ssl
          import time
          from email.message import EmailMessage


          def required(name):
              value = os.environ.get(name, "").strip()
              if not value:
                  raise SystemExit(f"{name} is missing")
              if "\r" in value or "\n" in value:
                  raise SystemExit(f"{name} contains invalid header characters")
              return value


          username = required("QQ_SMTP_USERNAME")
          auth_code = required("QQ_SMTP_AUTH_CODE")
          recipient = required("ALERT_EMAIL_TO")
          cc_recipient = os.environ.get("ALERT_EMAIL_CC", "").strip()
          if "\r" in cc_recipient or "\n" in cc_recipient:
              raise SystemExit("ALERT_EMAIL_CC contains invalid header characters")

          server_url = os.environ.get("GITHUB_SERVER_URL", "https://github.com")
          repository = os.environ.get("GITHUB_REPOSITORY", "")
          run_id = os.environ.get("GITHUB_RUN_ID", "")
          run_url = f"{server_url}/{repository}/actions/runs/{run_id}"

          message = EmailMessage()
          message["From"] = username
          message["To"] = recipient
          if cc_recipient:
              message["Cc"] = cc_recipient
          message["Subject"] = "[DouYin] scheduled send job failed"
          message.set_content(
              "The DouYin send job failed and needs manual review.\n\n"
              f"Repository: {repository}\n"
              f"Workflow run: {run_url}\n"
              "The email job does not include cookie or SMTP secret values."
          )

          context = ssl.create_default_context()
          for attempt in range(1, 4):
              try:
                  with smtplib.SMTP_SSL("smtp.qq.com", 465, context=context, timeout=30) as smtp:
                      smtp.login(username, auth_code)
                      smtp.send_message(message)
                  break
              except (OSError, smtplib.SMTPException) as exc:
                  if attempt == 3:
                      raise SystemExit(
                          f"email delivery failed after {attempt} attempts: {type(exc).__name__}"
                      ) from exc
                  time.sleep(attempt * 2)
