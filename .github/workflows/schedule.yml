name: DouYin Spark Flow Schedule Run
on:
  schedule:
    - cron: '30 19 * * *' # 03:30 Asia/Shanghai
  workflow_dispatch:
    inputs:
      mode:
        description: 'Probe without sending, or send to all five targets'
        type: choice
        options: [probe, send]
        default: probe
        required: true
permissions:
  contents: write
concurrency:
  group: douyin-spark-flow
  cancel-in-progress: false
jobs:
  execute:
    runs-on: ubuntu-latest
    environment: user-data
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install fixed runtime
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install-deps chromium
      - name: Install verified browser
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 2 --max-time 600 -o /tmp/cloak.tar.gz https://github.com/CloakHQ/CloakBrowser/releases/download/chromium-v146.0.7680.177.5/cloakbrowser-linux-x64.tar.gz
          echo '4a12bcde95fa1bb1beef2b41ab5e5c27c36be78e3be3d0dac8c64d705216670e  /tmp/cloak.tar.gz' | sha256sum -c -
          mkdir -p /tmp/cloak
          tar -xzf /tmp/cloak.tar.gz -C /tmp/cloak
          chrome=$(find /tmp/cloak -type f -name chrome -perm -u+x | head -n 1)
          test -n "$chrome"
          echo "CLOAKBROWSER_BINARY_PATH=$chrome" >> "$GITHUB_ENV"
      - name: Run standard workflow and publish sanitized result
        env:
          GH_TOKEN: ${{ github.token }}
          DOUYIN_MODE: ${{ github.event_name == 'schedule' && 'send' || inputs.mode }}
          PROBE_SCREENSHOT_PUBLIC_KEY: .codex/probe-screenshot-public.pem
          COOKIES_601501187I3: ${{ secrets.COOKIES_601501187I3 }}
          CLOAKBROWSER_AUTO_UPDATE: 'false'
          DEBUG: 'false'
        run: python scripts/remote_workflow.py
      - name: Preserve encrypted probe screenshot
        if: ${{ always() && inputs.mode == 'probe' }}
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-probe-screenshot
          path: artifacts/private-probe/*.enc
          retention-days: 1
          if-no-files-found: ignore

  email-on-failure:
    if: ${{ always() && needs.execute.result == 'failure' }}
    needs: execute
    runs-on: ubuntu-latest
    environment: user-data
    timeout-minutes: 5
    env:
      QQ_SMTP_USERNAME: ${{ secrets.QQ_SMTP_USERNAME }}
      QQ_SMTP_AUTH_CODE: ${{ secrets.QQ_SMTP_AUTH_CODE }}
      ALERT_EMAIL_TO: x.rover.studio@gmail.com
      ALERT_EMAIL_CC: xhy.09613@qq.com
    steps:
      - name: Send failure email through QQ Mail
        shell: python3 {0}
        run: |
          import os
          import smtplib
          import ssl
          import time
          from email.message import EmailMessage


          def required(name):
              value = os.environ.get(name, "").strip()
              if not value:
                  raise SystemExit(f"{name} is missing")
              if "\r" in value or "\n" in value:
                  raise SystemExit(f"{name} contains invalid header characters")
              return value


          username = required("QQ_SMTP_USERNAME")
          auth_code = required("QQ_SMTP_AUTH_CODE")
          recipient = required("ALERT_EMAIL_TO")
          cc_recipient = os.environ.get("ALERT_EMAIL_CC", "").strip()
          if "\r" in cc_recipient or "\n" in cc_recipient:
              raise SystemExit("ALERT_EMAIL_CC contains invalid header characters")

          server_url = os.environ.get("GITHUB_SERVER_URL", "https://github.com")
          repository = os.environ.get("GITHUB_REPOSITORY", "")
          run_id = os.environ.get("GITHUB_RUN_ID", "")
          run_url = f"{server_url}/{repository}/actions/runs/{run_id}"

          message = EmailMessage()
          message["From"] = username
          message["To"] = recipient
          if cc_recipient:
              message["Cc"] = cc_recipient
          message["Subject"] = "[抖音续火花失败] GitHub Actions 运行失败"
          message.set_content(
              "抖音工作流失败，请检查运行详情；请勿重复发送结果不明的消息。\n\n"
              f"Repository: {repository}\n"
              f"Workflow run: {run_url}\n"
              "The email job does not include cookie or SMTP secret values."
          )

          context = ssl.create_default_context()
          for attempt in range(1, 4):
              try:
                  with smtplib.SMTP_SSL("smtp.qq.com", 465, context=context, timeout=30) as smtp:
                      smtp.login(username, auth_code)
                      smtp.send_message(message)
                  break
              except (OSError, smtplib.SMTPException) as exc:
                  if attempt == 3:
                      raise SystemExit(
                          f"email delivery failed after {attempt} attempts: {type(exc).__name__}"
                      ) from exc
                  time.sleep(attempt * 2)
